<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Shopping Cart</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .checkout-button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #2a8f2a;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    .checkout-button:hover {
      background-color: #237523;
    }
  </style>
</head>
<body>
  <header>
    <h1>🛒 Your Cart</h1>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </header>

  <div id="cart-items" class="cart-grid"></div>

  <div id="total" class="cart-total"></div>

  <script>
    function displayCart() {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      const container = document.getElementById("cart-items");
      container.innerHTML = "";

      let total = 0;
      let gstTotal = 0;
      let pstTotal = 0;
      let shippingTotal = 0;

      cart.forEach((item, index) => {
        const quantity = item.quantity;
        const itemTotal = item.price * quantity;
        const gst = (item.gst || 0) * itemTotal;
        const pst = (item.pst || 0) * itemTotal;
        const shipping = (item.shipping || 0) * quantity;

        gstTotal += gst;
        pstTotal += pst;
        shippingTotal += shipping;
        total += itemTotal + gst + pst + shipping;

        const productDiv = document.createElement("div");
        productDiv.className = "cart-item";
        productDiv.innerHTML = `
          <h3>${item.name}</h3>
          <p>Price: $${item.price.toFixed(2)}</p>
          <p>Quantity: ${quantity}</p>
          <p>GST: $${gst.toFixed(2)} | PST: $${pst.toFixed(2)} | Shipping: $${shipping.toFixed(2)}</p>
          <button onclick="removeFromCart(${index})">Remove</button>
        `;
        container.appendChild(productDiv);
      });

      const totalDiv = document.getElementById("total");
      totalDiv.innerHTML = `
        <p>GST Total: $${gstTotal.toFixed(2)}</p>
        <p>PST Total: $${pstTotal.toFixed(2)}</p>
        <p>Shipping Total: $${shippingTotal.toFixed(2)}</p>
        <strong>Total: $${total.toFixed(2)}</strong><br/>
        <button id="checkout-btn" class="checkout-button">Proceed to Checkout</button>
      `;

      // Add checkout functionality
      document.getElementById("checkout-btn").onclick = () => {
        if (cart.length === 0) {
          alert("Your cart is empty!");
          return;
        }
        alert("Redirecting to checkout...");
        window.location.href = "checkout.html";
      };
    }

    function removeFromCart(index) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      if (cart[index].quantity > 1) {
        cart[index].quantity -= 1;
      } else {
        cart.splice(index, 1);
      }
      localStorage.setItem("cart", JSON.stringify(cart));
      displayCart();
    }

    displayCart();
  </script>
</body>
</html>
