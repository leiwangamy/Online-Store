<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Shopping Cart</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .checkout-button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #2a8f2a;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    .checkout-button:hover {
      background-color: #237523;
    }

    #custom-alert {
      display: none;
      background-color: #fff8c4;
      color: #444;
      padding: 10px;
      margin: 15px;
      border-left: 5px solid #f0c36d;
      font-weight: bold;
    }

    .cart-item {
      margin-bottom: 25px;
    }

    #user-details {
      margin: 10px 0;
      font-style: italic;
      color: #444;
    }
  </style>
</head>
<body>
  <header>
    <h1>🛒 Your Cart</h1>
    <nav>
      <a href="index.html">🏠 Home</a> |
      <span id="user-info"></span>
      <a href="#" id="logout-link" style="display: none;">(Logout)</a>
      <a href="account.html" id="account-link" style="display: none;">👤 My Account</a>
      <a href="login.html" id="login-link" style="display: none;">🔐 Login</a>
      <a href="register.html" id="register-link" style="display: none;">📝 Register</a>
    </nav>
    <div id="user-details"></div>
  </header>

  <div id="custom-alert"></div>
  <div id="cart-items" class="cart-grid"></div>
  <div id="total" class="cart-total"></div>

  <script>
    function showTemporaryAlert(message, duration = 2000) {
      const alertBox = document.getElementById("custom-alert");
      if (alertBox) {
        alertBox.textContent = message;
        alertBox.style.display = "block";
        setTimeout(() => {
          alertBox.style.display = "none";
        }, duration);
      }
    }

    function displayCart() {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      const container = document.getElementById("cart-items");
      const totalDiv = document.getElementById("total");
      container.innerHTML = "";
      totalDiv.innerHTML = "";

      if (cart.length === 0) {
        container.innerHTML = "<p>Your cart is empty.</p>";
        return;
      }

      let total = 0;
      let gstTotal = 0;
      let pstTotal = 0;
      let shippingTotal = 0;

      cart.forEach((item, index) => {
        const quantity = item.quantity;
        const itemTotal = item.price * quantity;
        const gst = (item.gst || 0) * itemTotal;
        const pst = (item.pst || 0) * itemTotal;
        const shipping = (item.shipping || 0) * quantity;

        gstTotal += gst;
        pstTotal += pst;
        shippingTotal += shipping;
        total += itemTotal + gst + pst + shipping;

        const productDiv = document.createElement("div");
        productDiv.className = "cart-item";

        productDiv.innerHTML = `
          <div style="display: flex; gap: 15px; align-items: center;">
            <img src="${item.image}" alt="${item.name}" width="100" style="border-radius: 8px;" />
            <div>
              <h3>${item.name}</h3>
              <p>Price: $${item.price.toFixed(2)}</p>
              <p>Quantity: ${quantity}</p>
              <p>GST: $${gst.toFixed(2)} | PST: $${pst.toFixed(2)} | Shipping: $${shipping.toFixed(2)}</p>
              <button onclick="removeFromCart(${index})" class="checkout-button" style="background-color:#28a745;">Remove</button>
            </div>
          </div>
        `;

        container.appendChild(productDiv);
      });

      totalDiv.innerHTML = `
        <p>GST Total: $${gstTotal.toFixed(2)}</p>
        <p>PST Total: $${pstTotal.toFixed(2)}</p>
        <p>Shipping Total: $${shippingTotal.toFixed(2)}</p>
        <strong>Total: $${total.toFixed(2)}</strong><br/>
        <button id="checkout-btn" class="checkout-button">Proceed to Checkout</button>
        <button onclick="window.location.href='index.html'" class="checkout-button" style="background-color:#2980b9;">Continue Shopping</button>
      `;

      document.getElementById("checkout-btn").onclick = () => {
        if (cart.length === 0) {
          showTemporaryAlert("🛑 Your cart is empty.");
          return;
        }
        
        // Check if user is logged in before proceeding to checkout
        const user = JSON.parse(localStorage.getItem("user"));
        if (!user || !user.username) {
          showTemporaryAlert("Please log in to proceed to checkout.");
          setTimeout(() => {
            window.location.href = "login.html?redirect=checkout.html";
          }, 1500);
          return;
        }
        
        window.location.href = "checkout.html";
      };
    }

    function removeFromCart(index) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      if (cart[index].quantity > 1) {
        cart[index].quantity -= 1;
      } else {
        cart.splice(index, 1);
      }
      localStorage.setItem("cart", JSON.stringify(cart));
      displayCart();
    }

    function updateUserHeader() {
      const user = JSON.parse(localStorage.getItem("user"));
      const userInfo = document.getElementById("user-info");
      const logoutLink = document.getElementById("logout-link");
      const accountLink = document.getElementById("account-link");
      const loginLink = document.getElementById("login-link");
      const registerLink = document.getElementById("register-link");
      const userDetails = document.getElementById("user-details");

      if (user && user.username) {
        userInfo.textContent = `👤 Logged in as: ${user.username}`;
        logoutLink.style.display = "inline";
        accountLink.style.display = "inline";
        loginLink.style.display = "none";
        registerLink.style.display = "none";

        if (user.fullName || user.address) {
          userDetails.innerHTML = `
            <strong>Name:</strong> ${user.fullName || "N/A"}<br>
            <strong>Address:</strong> ${user.address || "N/A"}
          `;
        }
      } else {
        userInfo.textContent = "👤 Not logged in";
        logoutLink.style.display = "none";
        accountLink.style.display = "none";
        loginLink.style.display = "inline";
        registerLink.style.display = "inline";
        userDetails.innerHTML = "";
      }
    }

    function logout() {
      localStorage.removeItem("user");
      localStorage.removeItem("cart");
      window.location.href = "/login.html";
    }

    document.addEventListener("DOMContentLoaded", () => {
      displayCart();
      updateUserHeader();
      const logoutLink = document.getElementById("logout-link");
      if (logoutLink) {
        logoutLink.addEventListener("click", (e) => {
          e.preventDefault();
          logout();
        });
      }
    });
  </script>
</body>
</html>
