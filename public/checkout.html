<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Checkout</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: Arial;
      margin: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 8px;
      font-size: 16px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #confirmation {
      margin-top: 30px;
      padding: 15px;
      background-color: #e0ffe0;
      border: 1px solid #8bc34a;
      display: none;
    }
    /* ✅ Optional spacing for continue link */
    .continue-link {
      margin-top: 20px;
      display: inline-block;
      font-weight: bold;
      color: green;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Checkout</h2>

    <!-- Order Summary Section -->
    <div id="order-summary" style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
      <h3>Order Summary</h3>
      <div id="cart-items-summary"></div>
      <div id="order-totals" style="border-top: 2px solid #dee2e6; padding-top: 15px; margin-top: 15px;">
        <div style="display: flex; justify-content: space-between; margin: 5px 0;">
          <span>Subtotal:</span>
          <span id="subtotal">$0.00</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin: 5px 0;">
          <span>GST:</span>
          <span id="gst-total">$0.00</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin: 5px 0;">
          <span>PST:</span>
          <span id="pst-total">$0.00</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin: 5px 0;">
          <span>Shipping:</span>
          <span id="shipping-total">$0.00</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin: 10px 0; font-weight: bold; font-size: 18px; border-top: 1px solid #dee2e6; padding-top: 10px;">
          <span>Total:</span>
          <span id="grand-total">$0.00</span>
        </div>
      </div>
    </div>

    <form id="checkout-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input id="name" required />
      </div>

      <div class="form-group">
        <label for="address">Shipping Address</label>
        <input id="address" required />
      </div>

      <div class="form-group">
        <label for="payment">Payment Method</label>
        <select id="payment" required>
          <option value="">--Select--</option>
          <option value="card">Credit Card</option>
          <option value="paypal">PayPal</option>
          <option value="cod">Cash on Delivery</option>
        </select>
      </div>

      <button type="submit">Confirm Order</button>
    </form>

    <div id="confirmation"></div>
  </div>

  <script>
    function displayOrderSummary() {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      const cartItemsContainer = document.getElementById("cart-items-summary");
      
      if (cart.length === 0) {
        cartItemsContainer.innerHTML = "<p>Your cart is empty.</p>";
        return;
      }

      let subtotal = 0;
      let gstTotal = 0;
      let pstTotal = 0;
      let shippingTotal = 0;

      // Display cart items
      cartItemsContainer.innerHTML = cart.map(item => {
        const itemTotal = item.price * item.quantity;
        const gst = (item.gst || 0) * itemTotal;
        const pst = (item.pst || 0) * itemTotal;
        const shipping = (item.shipping || 0) * item.quantity;

        subtotal += itemTotal;
        gstTotal += gst;
        pstTotal += pst;
        shippingTotal += shipping;

        return `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee;">
            <div style="display: flex; align-items: center; gap: 15px;">
              <img src="${item.image}" alt="${item.name}" width="50" style="border-radius: 4px;" />
              <div>
                <strong>${item.name}</strong><br>
                <small>Qty: ${item.quantity} × $${item.price.toFixed(2)}</small>
              </div>
            </div>
            <div style="text-align: right;">
              <strong>$${itemTotal.toFixed(2)}</strong>
            </div>
          </div>
        `;
      }).join('');

      // Update totals
      const grandTotal = subtotal + gstTotal + pstTotal + shippingTotal;
      
      document.getElementById("subtotal").textContent = `$${subtotal.toFixed(2)}`;
      document.getElementById("gst-total").textContent = `$${gstTotal.toFixed(2)}`;
      document.getElementById("pst-total").textContent = `$${pstTotal.toFixed(2)}`;
      document.getElementById("shipping-total").textContent = `$${shippingTotal.toFixed(2)}`;
      document.getElementById("grand-total").textContent = `$${grandTotal.toFixed(2)}`;
    }

    // Check if user is logged in on page load
    document.addEventListener("DOMContentLoaded", () => {
      const user = JSON.parse(localStorage.getItem("user"));
      
      if (!user || !user.username) {
        // Not logged in → redirect to login page with return URL
        window.location.href = `/login.html?redirect=checkout.html`;
        return;
      }

      // User is logged in, auto-fill their info
      if (user.fullName) document.getElementById("name").value = user.fullName;
      if (user.address) document.getElementById("address").value = user.address;
      
      // Display order summary
      displayOrderSummary();
    });

    // ✅ Handle order confirmation
    document.getElementById("checkout-form").onsubmit = async function (e) {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const address = document.getElementById("address").value;
      const payment = document.getElementById("payment").value;

      if (!name || !address || !payment) return;

      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      const user = JSON.parse(localStorage.getItem("user"));
      
      // Calculate totals
      let subtotal = 0;
      let gstTotal = 0;
      let pstTotal = 0;
      let shippingTotal = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        const gst = (item.gst || 0) * itemTotal;
        const pst = (item.pst || 0) * itemTotal;
        const shipping = (item.shipping || 0) * item.quantity;

        subtotal += itemTotal;
        gstTotal += gst;
        pstTotal += pst;
        shippingTotal += shipping;
      });

      const grandTotal = subtotal + gstTotal + pstTotal + shippingTotal;

      // Prepare order data
      const orderData = {
        customerName: name,
        customerUsername: user?.username || 'guest',
        shippingAddress: address,
        paymentMethod: payment,
        items: cart,
        subtotal: subtotal,
        gst: gstTotal,
        pst: pstTotal,
        shipping: shippingTotal,
        total: grandTotal
      };

      try {
        // Submit order to server
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(orderData)
        });

        if (response.ok) {
          const order = await response.json();
          
          // ✅ Clear cart after successful order
          localStorage.removeItem("cart");

          // ✅ Show confirmation with order number
          const confirmation = document.getElementById("confirmation");
          confirmation.innerHTML = `
            <h3>✅ Order Confirmed!</h3>
            <p><strong>Order #:</strong> ${order.id}</p>
            <p><strong>Name:</strong> ${name}</p>
            <p><strong>Address:</strong> ${address}</p>
            <p><strong>Payment:</strong> ${payment}</p>
            <p><strong>Total:</strong> $${grandTotal.toFixed(2)}</p>
            <p>Thank you for your purchase!</p>
            <a class="continue-link" href="index.html">← Continue Shopping</a>
          `;
          confirmation.style.display = "block";
          document.getElementById("checkout-form").style.display = "none";
          document.getElementById("order-summary").style.display = "none";
        } else {
          alert('Failed to submit order. Please try again.');
        }
      } catch (error) {
        alert('Error submitting order. Please try again.');
        console.error('Order submission error:', error);
      }
    };
  </script>
</body>
</html>
