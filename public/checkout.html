<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Checkout</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: Arial;
      margin: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 8px;
      font-size: 16px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #confirmation {
      margin-top: 30px;
      padding: 15px;
      background-color: #e0ffe0;
      border: 1px solid #8bc34a;
      display: none;
    }
    /* ✅ Optional spacing for continue link */
    .continue-link {
      margin-top: 20px;
      display: inline-block;
      font-weight: bold;
      color: green;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Checkout</h2>

    <form id="checkout-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input id="name" required />
      </div>

      <div class="form-group">
        <label for="address">Shipping Address</label>
        <input id="address" required />
      </div>

      <div class="form-group">
        <label for="payment">Payment Method</label>
        <select id="payment" required>
          <option value="">--Select--</option>
          <option value="card">Credit Card</option>
          <option value="paypal">PayPal</option>
          <option value="cod">Cash on Delivery</option>
        </select>
      </div>

      <button type="submit">Confirm Order</button>
    </form>

    <div id="confirmation"></div>
  </div>

  <script>

    fetch('/api/user')
    .then(res => res.json())
    .then(user => {
      if (!user.username) {
        // Not logged in → redirect to login page with return URL
        window.location.href = `/login.html?redirect=checkout.html`;
      } else {
        // Continue with showing the checkout page
        loadCheckoutPage(user);
      }
    });

    // ✅ Auto-fill user info on page load
    document.addEventListener("DOMContentLoaded", () => {
      fetch("/api/user")
        .then(res => res.json())
        .then(data => {
          if (data.fullName) document.getElementById("name").value = data.fullName;
          if (data.address) document.getElementById("address").value = data.address;
        });
    });

    // ✅ Handle order confirmation
    document.getElementById("checkout-form").onsubmit = function (e) {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const address = document.getElementById("address").value;
      const payment = document.getElementById("payment").value;

      if (!name || !address || !payment) return;

      // ✅ Just clear cart (not session)
      localStorage.removeItem("cart");

      // ✅ Show confirmation and link back to home
      const confirmation = document.getElementById("confirmation");
      confirmation.innerHTML = `
        <h3>✅ Order Confirmed!</h3>
        <p><strong>Name:</strong> ${name}</p>
        <p><strong>Address:</strong> ${address}</p>
        <p><strong>Payment:</strong> ${payment}</p>
        <p>Thank you for your purchase!</p>
        <a class="continue-link" href="index.html">← Continue Shopping</a>
      `;
      confirmation.style.display = "block";
      document.getElementById("checkout-form").style.display = "none";
    };
  </script>
</body>
</html>
