<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Natural Products</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .product-card {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin: 15px;
    }
    .product-image-wrapper {
      position: relative;
      display: inline-block;
    }
    .slide-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
    }
    .slide-button.left {
      left: 0;
    }
    .slide-button.right {
      right: 0;
    }
  </style>
</head>
<body>

  <div id="custom-alert" style="display:none; position:fixed; top:20px; right:20px; background:#4caf50; color:white; padding:10px 20px; border-radius:5px; z-index:1000;">
    Item added to cart
  </div>

  <header>
    <h1><img src="https://cdn-icons-png.flaticon.com/512/2909/2909765.png" width="30"> Natural Products</h1>
    <nav>
      <a href="cart.html">🛒 Cart (<span id="cart-count">0</span>)</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <div id="product-list" class="product-grid"></div>

  <script>
    fetch('/api/products')
      .then(res => res.json())
      .then(products => {
        const list = document.getElementById('product-list');
        list.innerHTML = '';

        products.forEach(product => {
          const div = document.createElement('div');
          div.className = 'product-card';

          const imageWrapper = document.createElement('div');
          imageWrapper.className = 'product-image-wrapper';

          const img = document.createElement('img');
          let imgIndex = 0;
          img.src = product.images?.[imgIndex] || "";
          img.alt = product.name;
          img.style.width = "200px";
          img.style.height = "200px";
          img.style.borderRadius = "8px";
          img.style.cursor = "pointer";
          img.onclick = () => {
            window.location.href = `product.html?id=${product.id}`;
          };

          const leftBtn = document.createElement('button');
          leftBtn.textContent = '←';
          leftBtn.className = 'slide-button left';
          leftBtn.onclick = () => {
            imgIndex = (imgIndex - 1 + product.images.length) % product.images.length;
            img.src = product.images[imgIndex];
          };

          const rightBtn = document.createElement('button');
          rightBtn.textContent = '→';
          rightBtn.className = 'slide-button right';
          rightBtn.onclick = () => {
            imgIndex = (imgIndex + 1) % product.images.length;
            img.src = product.images[imgIndex];
          };

          imageWrapper.appendChild(leftBtn);
          imageWrapper.appendChild(img);
          imageWrapper.appendChild(rightBtn);

          const name = document.createElement('h3');
          name.textContent = product.name;

          const desc = document.createElement('p');
          desc.textContent = product.description;

          const price = document.createElement('p');
          price.textContent = `$${product.price.toFixed(2)}`;

          const button = document.createElement('button');
          button.textContent = 'Add to Cart';
          button.onclick = () => {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const existing = cart.find(p => p.id === product.id);
            if (existing) {
              existing.quantity += 1;
            } else {
              cart.push({ ...product, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            document.getElementById('custom-alert').style.display = 'block';
            setTimeout(() => {
              document.getElementById('custom-alert').style.display = 'none';
            }, 2000);
            updateCartCount();
          };

          div.appendChild(imageWrapper);
          div.appendChild(name);
          div.appendChild(desc);
          div.appendChild(price);
          div.appendChild(button);
          list.appendChild(div);
        });
      });

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      document.getElementById('cart-count').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    updateCartCount();
  </script>

</body>
</html>
