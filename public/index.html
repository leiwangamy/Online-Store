<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Natural Products</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .product-card {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin: 15px;
    }
    .product-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    .product-image-wrapper {
      position: relative;
      display: inline-block;
      cursor: pointer;
    }
    .slide-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
    }
    .slide-button.left {
      left: 0;
    }
    .slide-button.right {
      right: 0;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      max-width: 600px;
      width: 90%;
    }
  </style>
</head>
<body>

  <div id="custom-alert" style="display:none; position:fixed; top:20px; right:20px; background:#4caf50; color:white; padding:10px 20px; border-radius:5px; z-index:1000;">
    Item added to cart
  </div>

  <header>
    <h1><img src="https://cdn-icons-png.flaticon.com/512/2909/2909765.png" width="30"> Natural Products</h1>
    <nav>
      <a href="cart.html">🛒 Cart (<span id="cart-count">0</span>)</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <div id="product-list" class="product-grid"></div>

  <div id="product-modal" class="modal">
    <div class="modal-content" id="modal-content"></div>
  </div>

  <script>
    function createMediaElement(file, width = 200) {
      const isVideo = file.match(/\.(mp4|webm|ogg)$/i);
      if (isVideo) {
        const video = document.createElement("video");
        video.src = file;
        video.controls = true;
        video.width = width;
        video.style.borderRadius = "8px";
        return video;
      } else {
        const img = document.createElement("img");
        img.src = file;
        img.alt = "Product media";
        img.width = width;
        img.style.borderRadius = "8px";
        return img;
      }
    }

    fetch('/api/products')
      .then(res => res.json())
      .then(products => {
        const list = document.getElementById('product-list');
        list.innerHTML = '';

        products.forEach(product => {
          const div = document.createElement('div');
          div.className = 'product-card';

          const mediaFiles = product.media || product.images || [];
          let mediaIndex = 0;
          let mediaElement = createMediaElement(mediaFiles[mediaIndex]);

          const mediaWrapper = document.createElement('div');
          mediaWrapper.className = 'product-image-wrapper';
          mediaWrapper.appendChild(mediaElement);

          const leftBtn = document.createElement('button');
          leftBtn.textContent = '<';
          leftBtn.className = 'slide-button left';
          leftBtn.onclick = (e) => {
            e.stopPropagation();
            mediaIndex = (mediaIndex - 1 + mediaFiles.length) % mediaFiles.length;
            const newMedia = createMediaElement(mediaFiles[mediaIndex]);
            mediaWrapper.replaceChild(newMedia, mediaElement);
            mediaElement = newMedia;
          };

          const rightBtn = document.createElement('button');
          rightBtn.textContent = '>';
          rightBtn.className = 'slide-button right';
          rightBtn.onclick = (e) => {
            e.stopPropagation();
            mediaIndex = (mediaIndex + 1) % mediaFiles.length;
            const newMedia = createMediaElement(mediaFiles[mediaIndex]);
            mediaWrapper.replaceChild(newMedia, mediaElement);
            mediaElement = newMedia;
          };

          mediaWrapper.appendChild(leftBtn);
          mediaWrapper.appendChild(rightBtn);
          div.appendChild(mediaWrapper);

          mediaWrapper.onclick = () => {
            showZoomedProduct(product);
          };

          const name = document.createElement('h3');
          name.textContent = product.name;

          const desc = document.createElement('p');
          desc.textContent = product.description;

          const price = document.createElement('p');
          price.textContent = `$${product.price.toFixed(2)}`;

          const button = document.createElement('button');
          button.textContent = 'Add to Cart';
          button.onclick = () => {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const existing = cart.find(p => p.id === product.id);
            if (existing) {
              existing.quantity += 1;
            } else {
              cart.push({ ...product, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            document.getElementById('custom-alert').style.display = 'block';
            setTimeout(() => {
              document.getElementById('custom-alert').style.display = 'none';
            }, 2000);
            updateCartCount();
          };

          div.appendChild(name);
          div.appendChild(desc);
          div.appendChild(price);
          div.appendChild(button);
          list.appendChild(div);
        });
      });

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      document.getElementById('cart-count').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    function showZoomedProduct(product) {
      const modal = document.getElementById("product-modal");
      const content = document.getElementById("modal-content");
      content.innerHTML = "";

      let mediaIndex = 0;
      const mediaFiles = product.media || product.images || [];
      let mediaElement = createMediaElement(mediaFiles[mediaIndex], 400);

      const mediaWrapper = document.createElement('div');
      mediaWrapper.className = 'product-image-wrapper';
      mediaWrapper.appendChild(mediaElement);

      const prev = document.createElement('button');
      prev.textContent = 'Prev';
      prev.onclick = () => {
        mediaIndex = (mediaIndex - 1 + mediaFiles.length) % mediaFiles.length;
        const newMedia = createMediaElement(mediaFiles[mediaIndex], 400);
        mediaWrapper.replaceChild(newMedia, mediaElement);
        mediaElement = newMedia;
      };

      const next = document.createElement('button');
      next.textContent = 'Next';
      next.onclick = () => {
        mediaIndex = (mediaIndex + 1) % mediaFiles.length;
        const newMedia = createMediaElement(mediaFiles[mediaIndex], 400);
        mediaWrapper.replaceChild(newMedia, mediaElement);
        mediaElement = newMedia;
      };

      const name = document.createElement('h2');
      name.textContent = product.name;

      const desc = document.createElement('p');
      desc.textContent = product.description;

      const price = document.createElement('p');
      price.innerHTML = `<strong>$${product.price.toFixed(2)}</strong>`;

      const add = document.createElement('button');
      add.textContent = "Add to Cart";
      add.style.margin = "10px";
      add.onclick = () => {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const existing = cart.find(p => p.id === product.id);
        if (existing) existing.quantity += 1;
        else cart.push({ ...product, quantity: 1 });
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount();
        modal.style.display = 'none';
      };

      const close = document.createElement('button');
      close.textContent = "← Continue Shopping";
      close.style.margin = "10px";
      close.onclick = () => modal.style.display = 'none';

      content.appendChild(mediaWrapper);
      content.appendChild(prev);
      content.appendChild(next);
      content.appendChild(name);
      content.appendChild(desc);
      content.appendChild(price);
      content.appendChild(add);
      content.appendChild(close);
      modal.style.display = 'flex';
    }

    window.onclick = function(event) {
      const modal = document.getElementById("product-modal");
      if (event.target === modal) {
        modal.style.display = "none";
      }
    }

    updateCartCount();
  </script>
</body>
</html>
