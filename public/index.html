<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Natural Products</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .product-card {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin: 15px;
    }
    .product-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    .product-image-wrapper {
      position: relative;
      display: inline-block;
      cursor: pointer;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 999;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
    }
    .modal-content {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      max-width: 700px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      position: relative;
    }
    .modal-media-wrapper {
      position: relative;
      margin-bottom: 20px;
    }
    .modal-nav-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      border: none;
      padding: 15px 20px;
      cursor: pointer;
      border-radius: 50%;
      font-size: 18px;
      font-weight: bold;
      transition: all 0.3s ease;
      z-index: 10;
    }
    .modal-nav-button:hover {
      background: rgba(0,0,0,0.9);
      transform: translateY(-50%) scale(1.1);
    }
    .modal-nav-button.left {
      left: 10px;
    }
    .modal-nav-button.right {
      right: 10px;
    }
    .close-modal {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #999;
      transition: color 0.3s ease;
    }
    .close-modal:hover {
      color: #333;
    }
    .media-indicator {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 15px;
    }
    .media-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ddd;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .media-dot.active {
      background: #007bff;
    }
    #search-bar {
      text-align: center;
      margin: 20px auto;
    }
    #search-input {
      width: 60%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div id="custom-alert" style="display:none; position:fixed; top:20px; right:20px; background:#4caf50; color:white; padding:10px 20px; border-radius:5px; z-index:1000;">
    Item added to cart
  </div>

  <header>
    <h1><img src="https://cdn-icons-png.flaticon.com/512/2909/2909765.png" width="30"> Natural Products</h1>
    <nav>
      <a href="cart.html">🛒 Cart (<span id="cart-count">0</span>)</a>
      <a href="account.html">👤 My Account</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="admin.html">🔐 Admin Login</a>
    </nav>
  </header>

  <div id="search-bar">
    <input type="text" id="search-input" placeholder="Search by product name...">
    <select id="category-filter">
      <option value="">All Categories</option>
    </select>
  </div>

  <div id="product-list" class="product-grid"></div>

  <div id="product-modal" class="modal">
    <div class="modal-content" id="modal-content"></div>
  </div>

  <script>
    function createMediaElement(file, width = 200) {
      const isVideo = file.match(/\.(mp4|webm|ogg)$/i);
      if (isVideo) {
        const video = document.createElement("video");
        video.src = file;
        video.controls = true;
        video.width = width;
        video.style.borderRadius = "8px";
        video.preload = "metadata";
        video.muted = true; // Many browsers require muted for autoplay

        // Comprehensive error handling
        video.onerror = function(e) {
          console.error("❌ Video failed to load:", file);
          console.error("Error details:", {
            error: video.error,
            errorCode: video.error?.code,
            errorMessage: video.error?.message,
            networkState: video.networkState,
            readyState: video.readyState
          });

          // Test if the video URL is accessible
          fetch(file, { method: 'HEAD' })
            .then(response => {
              console.log("📁 File accessibility test:", {
                status: response.status,
                contentType: response.headers.get('content-type'),
                contentLength: response.headers.get('content-length')
              });
            })
            .catch(fetchError => {
              console.error("🚫 File not accessible:", fetchError);
            });
        };

        video.onloadstart = function() {
          console.log("🚀 Video load started:", file);
        };

        video.onloadedmetadata = function() {
          console.log("📊 Video metadata loaded:", {
            duration: video.duration,
            videoWidth: video.videoWidth,
            videoHeight: video.videoHeight
          });
        };

        video.onloadeddata = function() {
          console.log("✅ Video data loaded successfully:", file);
        };

        video.oncanplay = function() {
          console.log("▶️ Video can start playing:", file);
        };

        video.onstalled = function() {
          console.warn("⏸️ Video loading stalled:", file);
        };

        video.onsuspend = function() {
          console.warn("⏸️ Video loading suspended:", file);
        };

        return video;
      } else {
        const img = document.createElement("img");
        img.src = file;
        img.alt = "Product media";
        img.width = width;
        img.style.borderRadius = "8px";
        img.onerror = function() {
          console.error("Image failed to load:", file);
        };
        return img;
      }
    }

    let allProducts = [];

    fetch('/api/products')
      .then(res => res.json())
      .then(products => {
        allProducts = products;
        renderProducts(products);

        // Populate category dropdown
        const categoryDropdown = document.getElementById('category-filter');
        const categories = [...new Set(products.map(p => p.category).filter(Boolean))];
        categories.forEach(cat => {
          const option = document.createElement('option');
          option.value = cat;
          option.textContent = cat;
          categoryDropdown.appendChild(option);
        });

        document.getElementById('search-input').addEventListener('input', filterProducts);
        categoryDropdown.addEventListener('change', filterProducts);
      });

    function filterProducts() {
      const keyword = document.getElementById('search-input').value.toLowerCase();
      const selectedCategory = document.getElementById('category-filter').value;

      const filtered = allProducts.filter(p => {
        const matchKeyword = p.name.toLowerCase().includes(keyword) ||
                             (p.category && p.category.toLowerCase().includes(keyword));
        const matchCategory = selectedCategory === "" || p.category === selectedCategory;
        return matchKeyword && matchCategory;
      });

      renderProducts(filtered);
    }

    function renderProducts(products) {
      const list = document.getElementById('product-list');
      list.innerHTML = '';

      products.forEach(product => {
        const div = document.createElement('div');
        div.className = 'product-card';

        const mediaFiles = product.media || product.images || [];
        // Just show the first image/video without carousel
        let mediaElement = createMediaElement(mediaFiles[0]);

        const mediaWrapper = document.createElement('div');
        mediaWrapper.className = 'product-image-wrapper';
        mediaWrapper.appendChild(mediaElement);
        div.appendChild(mediaWrapper);

        mediaWrapper.onclick = () => {
          showZoomedProduct(product);
        };

        const name = document.createElement('h3');
        name.textContent = product.name;

        const desc = document.createElement('p');
        desc.textContent = product.description;

        const price = document.createElement('p');
        price.textContent = `$${product.price.toFixed(2)}`;

        const button = document.createElement('button');
        button.textContent = 'Add to Cart';
        button.onclick = () => {
          const cart = JSON.parse(localStorage.getItem('cart')) || [];
          const existing = cart.find(p => p.id === product.id);
          if (existing) {
            existing.quantity += 1;
          } else {
            cart.push({ ...product, quantity: 1 });
          }
          localStorage.setItem('cart', JSON.stringify(cart));
          document.getElementById('custom-alert').style.display = 'block';
          setTimeout(() => {
            document.getElementById('custom-alert').style.display = 'none';
          }, 2000);
          updateCartCount();
        };

        div.appendChild(name);
        div.appendChild(desc);
        div.appendChild(price);
        div.appendChild(button);
        list.appendChild(div);
      });
    }

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      document.getElementById('cart-count').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    function showZoomedProduct(product) {
      const modal = document.getElementById("product-modal");
      const content = document.getElementById("modal-content");
      content.innerHTML = "";

      let mediaIndex = 0;
      const mediaFiles = product.media || product.images || [];
      
      // Close button
      const closeBtn = document.createElement('button');
      closeBtn.className = 'close-modal';
      closeBtn.innerHTML = '&times;';
      closeBtn.onclick = () => modal.style.display = 'none';
      content.appendChild(closeBtn);

      // Product name
      const name = document.createElement('h2');
      name.textContent = product.name;
      name.style.marginBottom = '20px';
      content.appendChild(name);

      // Media wrapper with navigation
      const mediaWrapper = document.createElement('div');
      mediaWrapper.className = 'modal-media-wrapper';
      
      let mediaElement = createMediaElement(mediaFiles[mediaIndex], 500);
      mediaWrapper.appendChild(mediaElement);

      // Navigation buttons (only show if multiple media files)
      if (mediaFiles.length > 1) {
        const prevBtn = document.createElement('button');
        prevBtn.className = 'modal-nav-button left';
        prevBtn.innerHTML = '&#8249;';
        prevBtn.onclick = () => {
          mediaIndex = (mediaIndex - 1 + mediaFiles.length) % mediaFiles.length;
          const newMedia = createMediaElement(mediaFiles[mediaIndex], 500);
          mediaWrapper.replaceChild(newMedia, mediaElement);
          mediaElement = newMedia;
          updateIndicators();
        };

        const nextBtn = document.createElement('button');
        nextBtn.className = 'modal-nav-button right';
        nextBtn.innerHTML = '&#8250;';
        nextBtn.onclick = () => {
          mediaIndex = (mediaIndex + 1) % mediaFiles.length;
          const newMedia = createMediaElement(mediaFiles[mediaIndex], 500);
          mediaWrapper.replaceChild(newMedia, mediaElement);
          mediaElement = newMedia;
          updateIndicators();
        };

        mediaWrapper.appendChild(prevBtn);
        mediaWrapper.appendChild(nextBtn);
      }

      content.appendChild(mediaWrapper);

      // Media indicators
      if (mediaFiles.length > 1) {
        const indicators = document.createElement('div');
        indicators.className = 'media-indicator';
        
        function updateIndicators() {
          indicators.innerHTML = '';
          mediaFiles.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.className = `media-dot ${index === mediaIndex ? 'active' : ''}`;
            dot.onclick = () => {
              mediaIndex = index;
              const newMedia = createMediaElement(mediaFiles[mediaIndex], 500);
              mediaWrapper.replaceChild(newMedia, mediaElement);
              mediaElement = newMedia;
              updateIndicators();
            };
            indicators.appendChild(dot);
          });
        }
        
        updateIndicators();
        content.appendChild(indicators);
      }

      // Product details
      const desc = document.createElement('p');
      desc.textContent = product.description;
      desc.style.fontSize = '16px';
      desc.style.margin = '20px 0';
      content.appendChild(desc);

      const price = document.createElement('p');
      price.innerHTML = `<strong style="font-size: 24px; color: #28a745;">$${product.price.toFixed(2)}</strong>`;
      price.style.margin = '20px 0';
      content.appendChild(price);

      // Action buttons
      const buttonContainer = document.createElement('div');
      buttonContainer.style.display = 'flex';
      buttonContainer.style.gap = '15px';
      buttonContainer.style.justifyContent = 'center';
      buttonContainer.style.marginTop = '25px';

      const addBtn = document.createElement('button');
      addBtn.textContent = "🛒 Add to Cart";
      addBtn.style.padding = "12px 25px";
      addBtn.style.backgroundColor = "#28a745";
      addBtn.style.color = "white";
      addBtn.style.border = "none";
      addBtn.style.borderRadius = "8px";
      addBtn.style.fontSize = "16px";
      addBtn.style.cursor = "pointer";
      addBtn.style.fontWeight = "bold";
      addBtn.onclick = () => {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const existing = cart.find(p => p.id === product.id);
        if (existing) existing.quantity += 1;
        else cart.push({ ...product, quantity: 1 });
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount();
        
        // Show success feedback
        document.getElementById('custom-alert').style.display = 'block';
        setTimeout(() => {
          document.getElementById('custom-alert').style.display = 'none';
        }, 2000);
        
        modal.style.display = 'none';
      };

      const continueBtn = document.createElement('button');
      continueBtn.textContent = "← Continue Shopping";
      continueBtn.style.padding = "12px 25px";
      continueBtn.style.backgroundColor = "#6c757d";
      continueBtn.style.color = "white";
      continueBtn.style.border = "none";
      continueBtn.style.borderRadius = "8px";
      continueBtn.style.fontSize = "16px";
      continueBtn.style.cursor = "pointer";
      continueBtn.onclick = () => modal.style.display = 'none';

      buttonContainer.appendChild(addBtn);
      buttonContainer.appendChild(continueBtn);
      content.appendChild(buttonContainer);

      modal.style.display = 'flex';
      
      // Add keyboard navigation
      const handleKeyDown = (e) => {
        if (e.key === 'Escape') {
          modal.style.display = 'none';
          document.removeEventListener('keydown', handleKeyDown);
        } else if (e.key === 'ArrowLeft' && mediaFiles.length > 1) {
          mediaIndex = (mediaIndex - 1 + mediaFiles.length) % mediaFiles.length;
          const newMedia = createMediaElement(mediaFiles[mediaIndex], 500);
          mediaWrapper.replaceChild(newMedia, mediaElement);
          mediaElement = newMedia;
          if (typeof updateIndicators === 'function') updateIndicators();
        } else if (e.key === 'ArrowRight' && mediaFiles.length > 1) {
          mediaIndex = (mediaIndex + 1) % mediaFiles.length;
          const newMedia = createMediaElement(mediaFiles[mediaIndex], 500);
          mediaWrapper.replaceChild(newMedia, mediaElement);
          mediaElement = newMedia;
          if (typeof updateIndicators === 'function') updateIndicators();
        }
      };
      
      document.addEventListener('keydown', handleKeyDown);
    }

    window.onclick = function(event) {
      const modal = document.getElementById("product-modal");
      if (event.target === modal) {
        modal.style.display = "none";
      }
    }

    updateCartCount();
  </script>
</body>
</html>
